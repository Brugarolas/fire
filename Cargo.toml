[package]
name = "Napalm"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
opt-level = 3
overflow-checks = false

[dependencies]
once_cell = "1.21.3"
anyhow = "1.0.104"

hashbrown = "0.17.1" # Fast hash map
ahash = "0.8.12" # Fast hash map
#gxhash = "3.5.0" # Fast hash map
papaya = "0.2.5" # Concurrent hash map

logos = "0.16.1"
#chumsky = "0.11.1" # Parser combinators
ariadne = "0.6.0" # Error reporting

trc = "1.2.4"
#archery = "1.2.1" # Faster Arc
#triomphe = "0.1.14" # Faster Arc
rclite = "0.4.2" # Optimized Rc for memory usage

smallvec = "1.15.1" # Small vectors for small collections, faster
#smolvec = "1.0.0" # Small vector optimization, flexible to save in heap when too many elements
small-map = "0.1.5" # Small map optimization
smallbox = "0.8.8" # Small Box<T> optimization
tinyvec = "1.13.3" # Tiny vector optimization
# tinyvec's macros live in a separate crate; needed for helpers/tiny_vec re-export.
tinyvec_macros = "0.1.1"
#tiny-str = "0.10.0" # Tiny string optimization

#lasso = "0.7.3" # String interning
#sarlacc = "0.1.4" # Interning
#stringzilla = "4.0.11" # Fast string handling
compact_str = "0.10.0" # String drop-in replacement

parking_lot = "0.12.5" # Concurrency primitives
#syncrs = "0.5.0" # Spinlock based sync primitives

#log = "0.4.28" # Log tracing
#tracing = "0.1.41" # Log tracing

seize = "0.5.1" # Memory reclamation

#mco = "0.1.48" # Coroutines (like Go's goroutines)
may = "0.3.51" # Coroutines like thread pool
#corosensei = "0.2.2" # Coroutines

rsvow = "0.1.1" # Promise/Future library
pinky-swear = "6.2.1" # Promises/Futures

small-uuid = "0.2.4" # Fast generation of UUIDs
time = "0.3.55" # Date and time handling

#zallocator = "0.5.1" # Zero-cost allocator for small allocations
likely_stable = "0.1.3" # Branch prediction hints
#memoized = "0.1.1" # Memoization

#job-pool = "0.6.0" # Job pool for parallelism

#mmtk = { git = "https://github.com/mmtk/mmtk-core.git", default-features = true } #git = "https://github.com/mmtk/mmtk-core.git", #version = "0.31"
mmtk = { path = "./crates/mmtk", features = ["malloc_mimalloc"] }
#abfall = "0.1.0"
bumpalo = "3.20.3"
mimalloc = "0.1.52"

libc = "0.2.190"
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

tokio = { version = "1.53.3", features = ["full", "rt-multi-thread", "macros"] }
axum = "0.8.9"
tokio-stream = "0.1.19"
futures-util = "0.3.34"
reqwest = "0.13.5"

serde = "1.0.229"
serde_json = "1.0.154"

cranelift = "0.136.3"
cranelift-module = "0.136.3"
cranelift-object = "0.136.3"
cranelift-jit = "0.136.3"
cranelift-native = "0.136.3"
cranelift-codegen = "0.136.3"
cranelift-frontend = "0.136.3"

# cranelift = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-module = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-object = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-jit = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-native = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-codegen = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }
# cranelift-frontend = { git = "file:///Users/andres/Documents/GitHub/wasmtime" }

memmap2 = "0.9.11"
target-lexicon = "0.13.5"

#polodb_core = "5.1.4" # Polodb embedded database
#chromadb = "2.3.0" # ChromaDB database

#reactive_tui = "0.0.5" # TUI library
#crossterm = "0.29.0" # Terminal handling

#dioxus-core = "0.6.3" # Dioxus UI library
#dioxus-desktop = "0.6.3" # Dioxus UI library
#dioxus-mobile = "0.6.2" # Dioxus UI library
#freya = "0.3.4" # Freya UI library
#blitz = "0.1.1" # Blitz UI library
#iced = "0.13.1" # Iced UI library
#cushy = "0.4.0" # Cushy UI library

[features]
# Enable the real GC by default. For “no-GC” build use: --no-default-features
default = ["gc", "std"]
gc = []
std = []
