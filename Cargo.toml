[package]
name = "PocketScript"
version = "0.1.0"
edition = "2024"

[dependencies]
once_cell = "1.21.3"
hashbrown = "0.15.4"
logos = "0.15.0"
tokio = { version = "1.46.1", features = ["full", "rt-multi-thread", "macros"] }
trc = "1.2.4"
hybrid-rc = "0.6.0"
smallvec = "1.15.1" # Small vectors for small collections, faster
parking_lot = "0.12.4" # Concurrency primitives
log = "0.4.27" # Log tracing
tracing = "0.1.41" # Log tracing
sarlacc = "0.1.4" # Interning
seize = "0.5.0" # Memory reclamation
mco = "0.1.48" # Coroutines (like Go's goroutines)
may = "0.3.51" # Coroutines like thread pool
corosensei = "0.2.2" # Coroutines
ahash = "0.8.12" # Fast hash map
gxhash = "3.5.0" # Fast hash map
lasso = "0.7.3" # String interning
chumsky = "0.10.1" # Parser combinators
archery = "1.2.1" # Faster Arc
triomphe = "0.1.14" # Faster Arc

# Disable default logging feature – it is large and not needed in PocketScript
mmtk = { git = "https://github.com/mmtk/mmtk-core.git", default-features = false, features = [
    # use Gen‑Immix plan (needs RO‑space + Immix mature space)
    "ro_space", "immix_non_moving",
]} #git = "https://github.com/mmtk/mmtk-core.git", #version = "0.31"

mimalloc = "0.1.47"

cranelift = "0.121.2"
cranelift-module = "0.121.2"
cranelift-object = "0.121.2"
cranelift-jit = "0.121.2"
cranelift-native = "0.121.2"
cranelift-codegen = "0.121.2"
cranelift-frontend = "0.121.2"
memmap2 = "0.9.7"
target-lexicon = "0.13.2"
